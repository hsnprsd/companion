services:
  codex:
    entrypoint: [node, /runner-probe.cjs]
    volumes:
      - ./tests/docker/runner.cjs:/runner-probe.cjs:ro,Z
      - type: volume
        source: codex-auth
        target: /home/node/.codex
        volume: {nocopy: false}

volumes:
  codex-auth:
    external: false
    name: ${RUNNER_PROBE_PROJECT:?Run tests/docker/runner.sh}-auth

networks:
  egress:
    internal: true
