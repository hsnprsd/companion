services:
  app:
    extends: {file: ../compose.yaml, service: app}
    depends_on:
      fixture: {condition: service_healthy}
    restart: 'no'
    environment:
      COMPANION_TELEGRAM_URL: http://fixture:8080
    volumes:
      - ${FIXTURE_DIR:?Run tests/run.sh}/companion.json:/etc/companion/companion.json:ro,Z
    networks: [fixtures]

  runner:
    extends: {file: ../compose.yaml, service: runner}
    depends_on:
      fixture: {condition: service_healthy}
    restart: 'no'
    volumes:
      - ${FIXTURE_DIR:?Run tests/run.sh}/models.json:/home/node/.pi/agent/models.json:ro,Z
    networks: [fixtures]

  fixture:
    build:
      context: ..
      dockerfile: tests/Dockerfile
    command: [serve]
    healthcheck:
      test: [CMD, /usr/local/bin/fixture, status]
      interval: 1s
      timeout: 2s
      retries: 20
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [fixtures]

volumes:
  state:
  sockets:
  workspace:
  pi-auth:

networks:
  fixtures:
    internal: true
