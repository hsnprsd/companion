services:
  app:
    build:
      context: .
      target: app
    depends_on:
      runner:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      COMPANION_CONFIG: /etc/companion/companion.json
      COMPANION_STATE_DIR: /app/state
      COMPANION_TELEGRAM_URL: ${COMPANION_TELEGRAM_URL:-https://api.telegram.org}
    volumes:
      - state:/app/state
      - sockets:/run/companion
      - type: bind
        source: ${COMPANION_CONFIG_SOURCE:-./companion.json}
        target: /etc/companion/companion.json
        read_only: true
        bind: {create_host_path: false, selinux: Z}

  runner:
    build:
      context: .
      target: runner
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, node, -e, 'const s = require("node:net").connect("/run/companion/runner.sock"); s.on("connect", () => s.end()); s.on("error", () => process.exit(1));']
      interval: 2s
      timeout: 2s
      retries: 10
    volumes:
      - workspace:/workspace
      - pi-auth:/home/node/.pi/agent
      - sockets:/run/companion

volumes:
  workspace:
  state:
  sockets:
  pi-auth:
    external: true
    name: companion-pi-auth
